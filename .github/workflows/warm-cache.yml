name: Warm cache

# Keeps rentoCustomer's shared caches (active vehicle listing, platform rating) — and by
# extension Neon's compute — from ever going cold, so no real visitor is ever the one who
# pays a cold-cache/cold-database-wake-up cost. See rentoCustomer/app/api/cron/warm-cache
# for what this actually refreshes and why.
#
# GitHub's own limits to be aware of:
#   - Scheduled workflows can run a few minutes late under GitHub-wide load — harmless
#     here since the target (5 min) sits well inside both the cache TTLs (15-25s is per
#     read, but Neon's own auto-suspend window is the real constraint at several minutes)
#     and there's no correctness requirement on exact timing, just "don't go idle long
#     enough to suspend."
#   - GitHub auto-disables scheduled workflows after 60 days with no commits to the
#     repo's default branch. A quiet repo means this stops firing silently — if pushes
#     ever go quiet for that long, re-enable it manually from the Actions tab (Actions →
#     this workflow → "Enable workflow") or push any commit to reset the clock.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab to test it

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ping warm-cache endpoint
        run: |
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            AUTH_HEADER="Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          else
            AUTH_HEADER="X-No-Auth: true"
          fi
          curl -sf -m 20 -H "$AUTH_HEADER" "${{ vars.RENTO_CUSTOMER_URL }}/api/cron/warm-cache"
